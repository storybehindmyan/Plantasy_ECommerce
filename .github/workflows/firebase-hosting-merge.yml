name: Deploy to Firebase Hosting + Functions on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_API_URL: ""

      - name: Install functions dependencies
        run: npm install
        working-directory: functions

      - name: Build functions
        run: npx tsc
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANTASY_BHARAT }}' > /tmp/sa.json

      - name: Set Razorpay config on Firebase Functions
        run: |
          firebase functions:config:set \
            razorpay.key_id="${{ secrets.RAZORPAY_KEY_ID }}" \
            razorpay.key_secret="${{ secrets.RAZORPAY_KEY_SECRET }}" \
            --project plantasy-bharat --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      - name: Deploy hosting and functions
        run: firebase deploy --only hosting,functions --project plantasy-bharat --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
