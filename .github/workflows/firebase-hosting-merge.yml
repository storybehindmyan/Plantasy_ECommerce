name: Deploy to Firebase Hosting + Functions on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install root dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_API_URL: ""

      - name: Install functions dependencies
        run: npm install
        working-directory: functions

      - name: Build functions
        run: npx tsc
        working-directory: functions

      - name: Create functions environment file
        run: |
          echo "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" > functions/.env
          echo "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}" >> functions/.env
          echo "DELHIVERY_API_KEY=${{ secrets.DELHIVERY_API_KEY }}" >> functions/.env
          echo "DELHIVERY_BASE_URL=${{ secrets.DELHIVERY_BASE_URL }}" >> functions/.env
          echo "WAREHOUSE_NAME=${{ secrets.WAREHOUSE_NAME }}" >> functions/.env
          echo "WAREHOUSE_PHONE=${{ secrets.WAREHOUSE_PHONE }}" >> functions/.env
          echo "WAREHOUSE_ADDRESS_LINE1=${{ secrets.WAREHOUSE_ADDRESS_LINE1 }}" >> functions/.env
          echo "WAREHOUSE_CITY=${{ secrets.WAREHOUSE_CITY }}" >> functions/.env
          echo "WAREHOUSE_STATE=${{ secrets.WAREHOUSE_STATE }}" >> functions/.env
          echo "WAREHOUSE_PINCODE=${{ secrets.WAREHOUSE_PINCODE }}" >> functions/.env
          echo "WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}" >> functions/.env
          echo "WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" >> functions/.env
          echo "WHATSAPP_VERIFY_TOKEN=${{ secrets.WHATSAPP_VERIFY_TOKEN }}" >> functions/.env

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANTASY_BHARAT }}' > /tmp/sa.json

      - name: Deploy hosting and functions
        run: firebase deploy --only hosting,functions --project plantasy-bharat --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
